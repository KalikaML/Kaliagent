# Cloud Build configuration for automatic deployment
# This file is used when deploying via GitHub integration

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:latest'
      - '.'
    timeout: 900s  # 15 minutes for Playwright installation

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'command-center-uat'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'command-center-uat-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-secrets'
      - 'SECRET_KEY=SECRET_KEY:latest,DB_NAME=DB_NAME:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_HOST=DB_HOST:latest,DB_PORT=DB_PORT:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,GMAIL_ADDRESS=GMAIL_ADDRESS:latest,GMAIL_APP_PASSWORD=GMAIL_APP_PASSWORD:latest,GMAIL_IMAP_HOST=GMAIL_IMAP_HOST:latest,DEFAULT_FROM_EMAIL=DEFAULT_FROM_EMAIL:latest,EMAIL_HOST=EMAIL_HOST:latest,EMAIL_PORT=EMAIL_PORT:latest,EMAIL_USE_TLS=EMAIL_USE_TLS:latest,EMAIL_HOST_USER=EMAIL_HOST_USER:latest,EMAIL_HOST_PASSWORD=EMAIL_HOST_PASSWORD:latest,SEARXNG_INSTANCE_URL=SEARXNG_INSTANCE_URL:latest,REDDIT_CLIENT_ID=REDDIT_CLIENT_ID:latest,REDDIT_CLIENT_SECRET=REDDIT_CLIENT_SECRET:latest,REDDIT_USER_AGENT=REDDIT_USER_AGENT:latest,PEXELS_API_KEY=PEXELS_API_KEY:latest,GIPHY_API_KEY=GIPHY_API_KEY:latest,LINKEDIN_ACCESS_TOKEN=LINKEDIN_ACCESS_TOKEN:latest,LINKEDIN_PERSON_URN=LINKEDIN_PERSON_URN:latest,GOOGLE_SHEETS_CREDENTIALS_JSON=GOOGLE_SHEETS_CREDENTIALS_JSON:latest,SUPPLIERS_CSV_DATA=SUPPLIERS_CSV_DATA:latest'
      - '--update-env-vars'
      - 'DJANGO_SETTINGS_MODULE=command_center.settings,DEBUG=False'
      - '--set-env-vars'
      - 'ALLOWED_HOSTS=$$CLOUD_RUN_SERVICE_URL'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

# Build timeout
timeout: 1200s  # 20 minutes total

# Artifact Registry location
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/command-center-repo/command-center:latest'

options:
  machineType: 'E2_HIGHCPU_8'  # Faster build machine
  logging: CLOUD_LOGGING_ONLY
