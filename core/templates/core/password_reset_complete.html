{% extends "core/base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
    <div class="max-w-md w-full text-center bg-slate-800/50 border border-slate-700 rounded-2xl p-8">
        <h2 class="text-2xl font-bold text-white mb-4">Password Changed Successfully</h2>
        <p class="text-slate-400">Your password has been reset. You can now log in with your new password.</p>
        <a href="{% url 'core:login' %}" class="inline-block mt-6 bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-lg">Login</a>
    </div>
</div>
{% endblock %}
