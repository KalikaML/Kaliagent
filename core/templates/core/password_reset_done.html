{% extends "core/base.html" %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
    <div class="max-w-md w-full text-center bg-slate-800/50 border border-slate-700 rounded-2xl p-8">
        <h2 class="text-2xl font-bold text-white mb-4">Email Has Been Sent</h2>
        <p class="text-slate-400">We've emailed you instructions for setting your password. If you don't receive an email, please check your spam folder.</p>
         <p class="text-center text-slate-400 text-sm mt-6">
            <a href="{% url 'core:login' %}" class="font-bold text-cyan-400 hover:text-cyan-300">
                Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
