{% extends "core/base.html" %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
    <div class="max-w-md w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-8">
        <h2 class="text-2xl font-bold text-center text-white mb-6">Reset Your Password</h2>
        <p class="text-slate-400 text-center mb-6">Enter your email address, and we will send you instructions to reset your password.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full mt-4 bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-lg">Send Reset Link</button>
        </form>
         <p class="text-center text-slate-400 text-sm mt-6">
            <a href="{% url 'core:login' %}" class="font-bold text-cyan-400 hover:text-cyan-300">
                Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
