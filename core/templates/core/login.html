{% extends "core/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
    <div class="max-w-md w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-8 shadow-lg">
        <h2 class="text-3xl font-bold text-center text-white mb-6">Login</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'core:login' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label for="username" class="block text-slate-400 text-sm font-bold mb-2">Username</label>
                <input type="text" name="username" id="username" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-cyan-500" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-slate-400 text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" id="password" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-cyan-500" required>
            </div>
            <div class="flex items-center justify-between mb-6">
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors">
                    Login
                </button>
            </div>
            <div class="text-center">
                <a class="inline-block align-baseline font-bold text-sm text-cyan-400 hover:text-cyan-300" href="{% url 'core:password_reset' %}">
                    Forgot your password?
                </a>
            </div>
        </form>
        <p class="text-center text-slate-400 text-sm mt-6">
            Don't have an account? 
            <a href="{% url 'core:register' %}" class="font-bold text-cyan-400 hover:text-cyan-300">
                Register
            </a>
        </p>
    </div>
</div>
{% endblock %}
