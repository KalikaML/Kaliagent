{% extends "core/base.html" %}

{% block title %}Company Profile Settings{% endblock %}

{% block content %}
<div class="flex-1 p-8 overflow-y-auto">
    <a href="{% url 'marketing_outreach:dashboard' %}" class="absolute top-4 left-4 z-50 flex items-center gap-2 bg-slate-700/50 hover:bg-slate-600/80 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Dashboard
    </a>
    <div class="max-w-3xl mx-auto">
        <h2 class="text-3xl font-bold text-white mb-2">Company Profile & Templates</h2>
        <p class="text-slate-400 mb-8">This information will be used by the AI agent to draft personalized emails.</p>

        <form method="POST" action="{% url 'marketing_outreach:settings' %}" class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700">
            {% csrf_token %}
            <h3 class="text-xl font-semibold text-white mb-6">Your Company Information</h3>
            <div class="space-y-5">
                <div>
                    <label for="companyName" class="block text-sm font-medium text-slate-300 mb-1">Company Name</label>
                    <input type="text" name="companyName" id="companyName" value="{{ user_profile.companyName }}" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"/>
                </div>
                <div>
                    <label for="contactPerson" class="block text-sm font-medium text-slate-300 mb-1">Your Name / Contact Person</label>
                    <input type="text" name="contactPerson" id="contactPerson" value="{{ user_profile.contactPerson }}" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"/>
                </div>
                <div>
                    <label for="role" class="block text-sm font-medium text-slate-300 mb-1">Your Role</label>
                    <input type="text" name="role" id="role" value="{{ user_profile.role }}" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"/>
                </div>
                <div>
                    <label for="products" class="block text-sm font-medium text-slate-300 mb-1">Products / Services Offered</label>
                    <textarea name="products" id="products" rows="3" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">{{ user_profile.products }}</textarea>
                </div>
                <div>
                    <label for="keyDifferentiators" class="block text-sm font-medium text-slate-300 mb-1">Key Differentiators</label>
                    <textarea name="keyDifferentiators" id="keyDifferentiators" rows="3" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">{{ user_profile.keyDifferentiators }}</textarea>
                </div>
            </div>
            <div class="mt-8 border-t border-slate-700 pt-6 flex justify-end">
                <button type="submit" class="bg-cyan-500 text-white font-semibold py-2 px-6 rounded-lg hover:bg-cyan-600 transition-colors">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
